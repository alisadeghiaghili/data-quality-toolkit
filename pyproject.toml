[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqt"
version = "0.1.0"
description = "DQT \u2014 SQL Data Quality Toolkit for DBAs"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
keywords = ["data-quality", "sql", "dba", "profiling", "diagnostics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
bridges = [
    # optional: pip install dqt[bridges] to enable missingly bridge
    # "missingly",
]

[project.scripts]
dqt = "dqt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dqt = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["dqt"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# psycopg/psycopg2/fastapi are optional extras (postgres, ui) not installed in
# the base dev environment — treat them as untyped rather than failing import.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg2", "fastapi"]
ignore_missing_imports = true

# Route decorators resolve to Any because fastapi itself is untyped here;
# that's a consequence of the override above, not a real typing gap.
[[tool.mypy.overrides]]
module = "dqt.ui.app"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
