[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqt"
version = "1.0.3"
description = "DQT \u2014 SQL Data Quality Toolkit for DBAs"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
keywords = ["data-quality", "sql", "dba", "profiling", "diagnostics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # starlette's TestClient needs an HTTP client of its own. Recent starlette
    # requires httpx2 and raises at import without it, which surfaces as a
    # collection error in tests/unit/ui/ rather than a skip -- so it must be a
    # declared dependency, not something a developer happens to have.
    "httpx2>=0.1",
    # tests/unit/bridges/ builds DataFrames to exercise the missingly adapter's
    # translation. It is a test dependency, not a runtime one: DQT core never
    # imports pandas. Declared here rather than relying on the bridges extra so
    # CI runs those tests instead of skipping them -- a skipped test
    # contributes no coverage, which would make the 90% gate measure less than
    # it claims to.
    "pandas>=2.0",
]
postgres = [
    # One driver per database (DQT-08). psycopg 3 is the maintained line and
    # the one dqt.sql.dialects.postgresql imports; psycopg2-binary was removed
    # because two drivers meant two connection behaviours to reason about
    # while enforcing read_only, and no test covered the second one.
    "psycopg[binary]>=3.1",
]
sqlserver = [
    # pyodbc needs a system ODBC driver ("ODBC Driver 18 for SQL Server" or
    # similar) that pip cannot install, so this extra is necessary but not
    # sufficient. dqt.sql.dialects.sqlserver imports it lazily and raises a
    # DQT error naming this extra when it is absent.
    "pyodbc>=5.0",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
bridges = [
    # dqt.bridges.missingly reads a bounded sample into a DataFrame and hands
    # it to `missingly`. Both are optional: DQT core is SQL-first and neither
    # is imported unless a bridge is explicitly called.
    "pandas>=2.0",
    "missingly>=1.0",
]

[project.scripts]
dqt = "dqt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The font and its licence are data, not code, and must reach an installed
# wheel: a file that exists only in a source checkout works in every test and
# fails for every user. The OFL requires the licence to travel with the font.
dqt = ["py.typed", "fonts/*.woff2", "fonts/OFL.txt"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# tools/doc_audit.py is vendored verbatim from the Consilient engineering
# standard (DOC-01) and must not be reformatted or "fixed" to satisfy this
# repo's lint config -- see tools/doc_audit.py's own module docstring and the
# DOC-01 PR description for why. CI's lint job is already scoped to
# `src/ tests/` and never sees it; this exclusion only stops local/pre-commit
# ruff runs (which default to all tracked Python files) from flagging it.
extend-exclude = ["tools/doc_audit.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["dqt"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# psycopg/pyodbc/fastapi are optional extras (postgres, sqlserver, ui) not
# installed in the base dev environment — treat them as untyped rather than
# failing import. psycopg2 is gone: DQT-08 settled on one PostgreSQL driver.
[[tool.mypy.overrides]]
module = ["psycopg", "pyodbc", "fastapi"]
ignore_missing_imports = true

# Route decorators resolve to Any because fastapi itself is untyped here;
# that's a consequence of the override above, not a real typing gap.
[[tool.mypy.overrides]]
module = "dqt.ui.app"
disallow_untyped_decorators = false

# tools/doc_audit.py is vendored verbatim from the Consilient engineering
# standard (DOC-01) and is not type-annotated to this repo's --strict bar.
# CI's typecheck job only ever runs `mypy src/dqt/`, which never reaches this
# file; this override exists solely so an incidental broader `mypy .` invocation
# does not flag a file we were told to copy, not author or edit.
[[tool.mypy.overrides]]
module = "doc_audit"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Raised from 90 on 2026-09-06, at the owner's instruction, once the suite
# was measured at 95.6%. A floor below what the suite already achieves is not
# a floor, it is a record of where the floor used to be -- it permits a
# regression nobody would otherwise accept.
fail_under = 95
