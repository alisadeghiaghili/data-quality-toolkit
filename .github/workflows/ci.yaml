# DQT — Continuous Integration
# ==============================
# Runs on every push and pull-request targeting main.
#
# Jobs (in dependency order):
#
#   lint          ruff check + ruff format --check
#   typecheck     mypy --strict on src/
#   docs          tools/doc_audit.py ratchet gate against .doc_audit_baseline.json (DOC-01)
#   test-unit     pytest tests/unit/ with coverage (threshold 80 %)
#   test-integration  pytest tests/integration/ (SQLite; no coverage gate)
#
# All jobs run on both Python 3.11 and 3.12, except `docs`: the gate's result
# depends only on docstring text via `ast.parse`, not on interpreter version,
# so running it twice would burn CI minutes without adding coverage.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint
  # --------------------------------------------------------------------------
  lint:
    name: "Lint (ruff) — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  # --------------------------------------------------------------------------
  # Job 2: Type checking
  # --------------------------------------------------------------------------
  typecheck:
    name: "Type check (mypy) — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: mypy
        run: mypy src/dqt/

  # --------------------------------------------------------------------------
  # Job 3: Documentation gate (DOC-01)
  # --------------------------------------------------------------------------
  # Enforces ENGINEERING-STANDARDS.md §2 in ratchet mode: pre-existing debt
  # recorded in .doc_audit_baseline.json is tolerated, any *new* violation
  # fails the build. Single Python version only -- the result is a function of
  # docstring text parsed via `ast`, not of the interpreter running it, so a
  # 3.11/3.12 matrix here would duplicate work for zero additional signal.
  docs:
    name: "Documentation gate (doc_audit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run documentation gate
        run: |
          python tools/doc_audit.py \
            --root . \
            --path src/dqt \
            --style google \
            --require-example \
            --baseline .doc_audit_baseline.json

  # --------------------------------------------------------------------------
  # Job 4: Unit tests + coverage
  # --------------------------------------------------------------------------
  test-unit:
    name: "Unit tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src/dqt \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 5: Integration tests (SQLite; no Docker required)
  # --------------------------------------------------------------------------
  test-integration:
    name: "Integration tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [test-unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  # --------------------------------------------------------------------------
  # Job 6: PostgreSQL integration tests (service container)
  # --------------------------------------------------------------------------
  # README has listed PostgreSQL as supported since the project began while
  # nothing exercised it, and BACKLOG recorded the sharpest consequence: the
  # PostgreSQL side of read_only enforcement had never been executed. That is
  # the tool's central safety promise, unrun, on the only production-grade
  # database it claims to support. docs/PROPOSAL-v1.0-roadmap.md makes this a
  # hard gate for 1.0.0 for exactly that reason.
  test-postgres:
    name: "PostgreSQL integration — Python 3.12"
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dqt
          POSTGRES_PASSWORD: dqt
          POSTGRES_DB: dqt_test
        ports:
          - 5432:5432
        # Without the health check the suite races the server's startup and
        # fails as a connection error rather than a test result.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the postgres extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,postgres]"

      - name: Run PostgreSQL integration tests
        env:
          DQT_POSTGRES_TEST_DSN: postgresql://dqt:dqt@localhost:5432/dqt_test
        # Run once, then check the summary. A skipped suite reports green and
        # proves nothing, and this job exists to produce evidence -- so
        # producing none has to be a failure. The check is on the captured
        # summary rather than a second run, because running twice invites the
        # two runs to disagree.
        run: |
          set -o pipefail
          pytest tests/integration/test_postgresql.py -v --color=no             | tee pg-results.txt
          if ! grep -qE "[0-9]+ passed" pg-results.txt; then
            echo "::error::No PostgreSQL test passed. The suite proved nothing." >&2
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" pg-results.txt; then
            echo "::error::PostgreSQL tests skipped; the DSN did not reach them." >&2
            exit 1
          fi

      - name: Four-hash read-only proof (PostgreSQL)
        env:
          DQT_POSTGRES_TEST_DSN: postgresql://dqt:dqt@localhost:5432/dqt_test
        # GATE-02, second engine. Here the server itself refuses the write, so
        # this proves the guard and the server agree rather than that the
        # guard is alone.
        run: |
          set -o pipefail
          pytest tests/integration/test_read_only_proof.py -v --color=no \
            -k "postgresql" | tee pg-proof.txt
          if ! grep -qE "[0-9]+ passed" pg-proof.txt; then
            echo "::error::The PostgreSQL read-only proof produced no evidence." >&2
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" pg-proof.txt; then
            echo "::error::The PostgreSQL read-only proof skipped; the DSN did not reach it." >&2
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Job 7: SQL Server integration tests (service container)
  # --------------------------------------------------------------------------
  # DQT-08 shipped a SQL Server dialect whose every assertion was about SQL
  # text. Whether pyodbc accepts the generated ODBC connection string, and
  # whether INFORMATION_SCHEMA returns what fetch_column_metadata expects,
  # could only be settled against an instance -- so DQT-08 said so and left a
  # skipped placeholder. This job closes that gap.
  test-sqlserver:
    name: "SQL Server integration — Python 3.12"
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway credentials for an ephemeral container that exists for
          # the length of one job and is never reachable from outside it.
          # SQL Server rejects anything that does not meet its complexity
          # rules, which is why this is not simply "test".
          MSSQL_SA_PASSWORD: "DqtCiTest!2026"
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver
        # pyodbc needs a system ODBC driver that pip cannot provide, which is
        # why dqt[sqlserver] is necessary but not sufficient. The dialect
        # defaults to "ODBC Driver 18 for SQL Server"; this installs it.
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc             | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list"             | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18

      - name: Install with the sqlserver extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,sqlserver]"

      - name: Wait for SQL Server and create the test database
        # The image ships no health-check command, and it takes appreciably
        # longer to accept connections than PostgreSQL does. Polling here
        # rather than in the service block keeps the failure legible: a
        # timeout says the server never came up, instead of every test failing
        # as a connection error.
        run: |
          python - <<'PYEOF'
          import sys, time
          import pyodbc

          base = (
              "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;"
              "UID=sa;PWD=DqtCiTest!2026;TrustServerCertificate=yes"
          )
          deadline = time.time() + 180
          last = None
          while time.time() < deadline:
              try:
                  connection = pyodbc.connect(base + ";DATABASE=master", autocommit=True)
                  connection.cursor().execute(
                      "IF DB_ID('dqt_test') IS NULL CREATE DATABASE dqt_test"
                  )
                  connection.close()
                  print("SQL Server is up and dqt_test exists.")
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(3)
          print(f"::error::SQL Server never became reachable: {last}", file=sys.stderr)
          sys.exit(1)
          PYEOF

      - name: Run SQL Server integration tests
        env:
          DQT_SQLSERVER_TEST_DSN: "mssql://sa:DqtCiTest!2026@localhost:1433/dqt_test?trust_server_certificate=yes"
        # Same guard as the PostgreSQL job: a skipped suite reports green and
        # proves nothing, and this job exists to produce evidence.
        run: |
          set -o pipefail
          pytest tests/integration/test_sqlserver.py -v --color=no             | tee mssql-results.txt
          if ! grep -qE "[0-9]+ passed" mssql-results.txt; then
            echo "::error::No SQL Server test passed. The suite proved nothing." >&2
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" mssql-results.txt; then
            echo "::error::SQL Server tests skipped; the DSN did not reach them." >&2
            exit 1
          fi

      - name: Four-hash read-only proof (SQL Server)
        env:
          DQT_SQLSERVER_TEST_DSN: "mssql://sa:DqtCiTest!2026@localhost:1433/dqt_test?trust_server_certificate=yes"
        # GATE-02. SQL Server is the engine where DQT's read-only promise is
        # weakest -- ADVISORY means the ODBC access-mode attribute is a
        # request, and a write that reaches the server lands. SQLite's driver
        # refuses and PostgreSQL's server refuses; here only DQT's own guard
        # does, so this is the most load-bearing safety test in the project.
        #
        # Selected by -k rather than by file, because the proof is
        # parametrised over both engines and the other one's cases would
        # otherwise skip -- which the guard below (correctly) treats as a
        # failure.
        run: |
          set -o pipefail
          pytest tests/integration/test_read_only_proof.py -v --color=no \
            -k "sqlserver or SqlServer" | tee mssql-proof.txt
          if ! grep -qE "[0-9]+ passed" mssql-proof.txt; then
            echo "::error::The SQL Server read-only proof produced no evidence." >&2
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" mssql-proof.txt; then
            echo "::error::The SQL Server read-only proof skipped; the DSN did not reach it." >&2
            exit 1
          fi
