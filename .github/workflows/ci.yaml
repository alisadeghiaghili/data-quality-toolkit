# DQT — Continuous Integration
# ==============================
# Runs on every push and pull-request targeting main.
#
# Jobs (in dependency order):
#
#   lint          ruff check + ruff format --check
#   typecheck     mypy --strict on src/
#   docs          tools/doc_audit.py ratchet gate against .doc_audit_baseline.json (DOC-01)
#   test-unit     pytest tests/unit/ with coverage (threshold 80 %)
#   test-integration  pytest tests/integration/ (SQLite; no coverage gate)
#
# All jobs run on both Python 3.11 and 3.12, except `docs`: the gate's result
# depends only on docstring text via `ast.parse`, not on interpreter version,
# so running it twice would burn CI minutes without adding coverage.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint
  # --------------------------------------------------------------------------
  lint:
    name: "Lint (ruff) — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  # --------------------------------------------------------------------------
  # Job 2: Type checking
  # --------------------------------------------------------------------------
  typecheck:
    name: "Type check (mypy) — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: mypy
        run: mypy src/dqt/

  # --------------------------------------------------------------------------
  # Job 3: Documentation gate (DOC-01)
  # --------------------------------------------------------------------------
  # Enforces ENGINEERING-STANDARDS.md §2 in ratchet mode: pre-existing debt
  # recorded in .doc_audit_baseline.json is tolerated, any *new* violation
  # fails the build. Single Python version only -- the result is a function of
  # docstring text parsed via `ast`, not of the interpreter running it, so a
  # 3.11/3.12 matrix here would duplicate work for zero additional signal.
  docs:
    name: "Documentation gate (doc_audit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run documentation gate
        run: |
          python tools/doc_audit.py \
            --root . \
            --path src/dqt \
            --style google \
            --require-example \
            --baseline .doc_audit_baseline.json

  # --------------------------------------------------------------------------
  # Job 4: Unit tests + coverage
  # --------------------------------------------------------------------------
  test-unit:
    name: "Unit tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src/dqt \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 5: Integration tests (SQLite; no Docker required)
  # --------------------------------------------------------------------------
  test-integration:
    name: "Integration tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [test-unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  # --------------------------------------------------------------------------
  # Job 6: PostgreSQL integration tests (service container)
  # --------------------------------------------------------------------------
  # README has listed PostgreSQL as supported since the project began while
  # nothing exercised it, and BACKLOG recorded the sharpest consequence: the
  # PostgreSQL side of read_only enforcement had never been executed. That is
  # the tool's central safety promise, unrun, on the only production-grade
  # database it claims to support. docs/PROPOSAL-v1.0-roadmap.md makes this a
  # hard gate for 1.0.0 for exactly that reason.
  test-postgres:
    name: "PostgreSQL integration — Python 3.12"
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dqt
          POSTGRES_PASSWORD: dqt
          POSTGRES_DB: dqt_test
        ports:
          - 5432:5432
        # Without the health check the suite races the server's startup and
        # fails as a connection error rather than a test result.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the postgres extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,postgres]"

      - name: Run PostgreSQL integration tests
        env:
          DQT_POSTGRES_TEST_DSN: postgresql://dqt:dqt@localhost:5432/dqt_test
        run: pytest tests/integration/test_postgresql.py -v

      - name: Fail if the suite skipped instead of running
        env:
          DQT_POSTGRES_TEST_DSN: postgresql://dqt:dqt@localhost:5432/dqt_test
        # A skipped suite reports green and proves nothing. This job exists to
        # produce evidence, so it must fail when it produced none.
        run: |
          pytest tests/integration/test_postgresql.py -q --no-header             | tee /tmp/pg.txt
          grep -qE "[0-9]+ passed" /tmp/pg.txt
          if grep -qE "[0-9]+ skipped" /tmp/pg.txt; then
            echo "PostgreSQL tests skipped; the DSN did not reach them." >&2
            exit 1
          fi
