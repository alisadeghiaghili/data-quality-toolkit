repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^tools/doc_audit\.py$
      - id: ruff-format
        exclude: ^tools/doc_audit\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: mypy src/dqt/ --strict
        language: system
        pass_filenames: false
        types: [python]
